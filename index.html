<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embedded Web Proxy</title>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #111; color: #fff; }
    .bar { display: flex; padding: 10px; background: #222; gap: 8px; }
    input { flex: 1; padding: 8px 12px; border: none; border-radius: 4px; font-size: 16px; }
    button { padding: 8px 16px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    iframe { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
  <div class="bar">
    <input type="text" id="urlInput" placeholder="Enter URL or search..." onkeydown="if(event.key==='Enter') loadSite()" />
    <button onclick="loadSite()">Go</button>
  </div>
  <iframe id="proxyFrame"></iframe>

  <script>
    function loadSite() {
      let input = document.getElementById("urlInput").value.trim();
      if (!input) return;

      let target;
      if (input.includes(".") && !input.includes(" ")) {
        target = input.startsWith("http://") || input.startsWith("https://") ? input : "https://" + input;
      } else {
        target = "https://duckduckgo.com" + encodeURIComponent(input);
      }

      document.getElementById("proxyFrame").src = `/.netlify/functions/proxy?url=${encodeURIComponent(target)}`;
    }
  </script>
</body>
</html>
